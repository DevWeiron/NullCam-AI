<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>NullCam AI</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="brand"><span class="logo">N</span><div><b>NULLCAM <em>AI</em></b><small>COMPUTATIONAL CAMERA</small></div></div><button id="galleryBtn" class="iconbtn">▧</button></header><section class="view"><video id="video" autoplay playsinline muted></video><canvas id="canvas" hidden></canvas><div id="placeholder" class="placeholder"><div class="cameraGlyph">◎</div><b>Камера готова</b><span>Нажми «Включить камеру»</span></div><div class="viewtop"><span class="live"><i></i> LIVE</span><span id="modeLabel">AUTO ENHANCE</span></div><div class="viewbottom"><span id="resolution">ОЖИДАНИЕ КАМЕРЫ</span><span>LIVE PREVIEW</span></div></section><div class="controls"><div class="toolbar"><button id="switchBtn" class="tool">↻<small>Камера</small></button><button id="flashBtn" class="tool">ϟ<small>Вспышка</small></button><button id="enhanceBtn" class="tool active">✦<small>Улучшение</small></button><button id="nightBtn" class="tool">☾<small>Ночь</small></button></div><div class="sliders"><label>Яркость <input id="brightness" type="range" min="70" max="160" value="110"></label><label>Контраст <input id="contrast" type="range" min="80" max="160" value="115"></label><label>Насыщенность <input id="saturation" type="range" min="0" max="180" value="110"></label></div><div class="shutterrow"><button id="startBtn" class="start">Включить камеру</button><button id="captureBtn" class="shutter" aria-label="Сделать фото"><span></span></button><button id="saveHint" class="iconbtn">⌑</button></div><div id="status">Готово к запуску</div></div></main><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
